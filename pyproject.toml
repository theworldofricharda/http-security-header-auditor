[project]
name = "secheader-audit"
version = "1.0.0"
description = "Audit a URL's HTTP security headers and grade the result A-F."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Richard Akinfadeyi" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
secheader-audit = "secheader_audit:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Foundations-tier layout: a single top-level module, no src/ package.
include = ["secheader_audit.py"]

[tool.pytest.ini_options]
addopts = "-q"
